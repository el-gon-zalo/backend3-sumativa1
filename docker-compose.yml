services:

  mysql:
    image: mysql:8.0
    container_name: translog-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: translog
      MYSQL_USER: translog
      MYSQL_PASSWORD: translog123
      MYSQL_ROOT_PASSWORD: root123

    ports:
      - "3306:3306"

    volumes:
      - translog_mysql_data:/var/lib/mysql

    command: --default-authentication-plugin=mysql_native_password

volumes:
  translog_mysql_data:

